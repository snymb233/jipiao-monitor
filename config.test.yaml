# 单航线测试配置
routes:
  - from: SHA
    from_name: 上海
    to: CTU
    to_name: 成都
    dates: ["2026-10-01"]
    alert_threshold: 600

platforms: [fliggy, tuniu]

schedule:
  interval_minutes: 120
  jitter_minutes: 30
  run_on_start: true

crawler:
  headless: true
  timeout_seconds: 45
  delay_min: 2
  delay_max: 5
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: true
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db
  log_path: logs/test.log

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: false
    send_key: ""
    channel: ""
