name: 跨平台比价（同程）

on:
  schedule:
    # 每天 UTC 2:00 = 北京时间 10:00
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: jipiao-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与浏览器
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium

      - name: 同程比价（最便宜的 12 条）
        run: python compare_platforms.py --top 12
        continue-on-error: true

      - name: 重新生成 README 价格表
        run: python build_readme.py

      - name: 提交数据
        run: |
          git config user.name "jipiao-bot"
          git config user.email "jipiao-bot@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "同程比价更新 $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: 守护：确保监控链仍在运行
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若监控链已断（无运行中的 monitor 任务），重新拉起
          running=$(gh run list --workflow monitor.yml --status in_progress --json databaseId 2>/dev/null | jq length || echo 0)
          queued=$(gh run list --workflow monitor.yml --status queued --json databaseId 2>/dev/null | jq length || echo 0)
          total=$((running + queued))
          echo "monitor 运行中: ${running}，排队中: ${queued}"
          if [ "$total" -eq 0 ]; then
            echo "监控链已断，重新拉起"
            gh workflow run monitor.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "监控链正常，不重复拉起"
          fi
