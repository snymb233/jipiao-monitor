name: 机票价格监控

on:
  schedule:
    # 每 20 分钟抓一个 (航线×日期) 组合；UTC 时间，+8 即北京时间
    - cron: "*/20 * * * *"
  workflow_dispatch:   # 允许手动触发测试

concurrency:
  group: jipiao-monitor
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -q -r requirements.txt

      - name: 抓取一个组合
        id: fetch
        run: python cloud_fetch.py
        continue-on-error: true

      - name: 重新生成 README 价格表
        run: python build_readme.py

      - name: 提交数据
        run: |
          git config user.name "jipiao-bot"
          git config user.email "jipiao-bot@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then
            echo "无数据变化"
          else
            git commit -m "价格更新 $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
