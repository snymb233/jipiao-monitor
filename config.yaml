# 机票价格监控配置
# 苏州周边机场(无锡/上海/盐城/扬州) → 兰州/西安/成都
# 出行日期: 2026-09-30 / 10-01 / 10-02 (国庆)

routes:
  # ===== 无锡硕放 WUX =====
  - from: WUX
    from_name: 无锡
    to: LHW
    to_name: 兰州
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600
  - from: WUX
    from_name: 无锡
    to: SIA
    to_name: 西安
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 500
  - from: WUX
    from_name: 无锡
    to: CTU
    to_name: 成都
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600

  # ===== 上海 SHA (虹桥+浦东) =====
  - from: SHA
    from_name: 上海
    to: LHW
    to_name: 兰州
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600
  - from: SHA
    from_name: 上海
    to: SIA
    to_name: 西安
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 500
  - from: SHA
    from_name: 上海
    to: CTU
    to_name: 成都
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600

  # ===== 盐城南洋 YNZ =====
  - from: YNZ
    from_name: 盐城
    to: LHW
    to_name: 兰州
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600
  - from: YNZ
    from_name: 盐城
    to: SIA
    to_name: 西安
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 500
  - from: YNZ
    from_name: 盐城
    to: CTU
    to_name: 成都
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600

  # ===== 扬州泰州 YTY =====
  - from: YTY
    from_name: 扬州
    to: LHW
    to_name: 兰州
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600
  - from: YTY
    from_name: 扬州
    to: SIA
    to_name: 西安
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 500
  - from: YTY
    from_name: 扬州
    to: CTU
    to_name: 成都
    dates: ["2026-09-30", "2026-10-01", "2026-10-02"]
    alert_threshold: 600

# 途牛为纯接口实现，实测稳定；fliggy 被风控暂禁用，需要多平台比价可再加 ctrip/qunar/tongcheng
platforms: [tuniu]

schedule:
  interval_minutes: 200      # 一轮全量约2小时(36个请求x3.5分钟), 留冷却余量
  jitter_minutes: 30         # 随机扰动
  run_on_start: true

crawler:
  headless: true
  timeout_seconds: 45
  delay_min: 120           # 常规间隔; 真正限速由内置滑动窗口控制(2次成功/10分钟)
  delay_max: 180
  max_attempts: 3          # 非风控失败的重试上限
  backoff_seconds: 30
  rate_limit: true         # 滑动窗口限速: 同进程10分钟内最多2次成功
  block_cooldown_seconds: 900   # 触发179991后静默冷却15分钟(冷却期内请求会延长封锁)
  block_max_attempts: 3         # 单日期封锁重试上限, 超过则放弃留待下一轮
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: true
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db
  log_path: logs/monitor.log

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: false           # 如需微信推送，到 sct.ftqq.com 注册后填 SendKey
    send_key: ""
    channel: ""
