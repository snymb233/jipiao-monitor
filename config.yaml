# 途牛/同程可用；fliggy 接口已被阿里下线；ctrip/qunar 页面结构已变，抓取失效
platforms: [tuniu]

schedule:
  interval_minutes: 20
  jitter_minutes: 0
  run_on_start: true

crawler:
  headless: true
  timeout_seconds: 45
  delay_min: 120
  delay_max: 180
  max_attempts: 3
  backoff_seconds: 30
  rate_limit: true
  block_cooldown_seconds: 900
  block_max_attempts: 3
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  mobile_user_agent: ""
  debug: true
  debug_dir: debug
  user_data_dir: user_data

output:
  db_path: data/prices.db
  log_path: logs/monitor.log

notifier:
  push_drop_min: 30
  push_rise_min: 50
  serverchan:
    enabled: false
    send_key: ""
    channel: ""
